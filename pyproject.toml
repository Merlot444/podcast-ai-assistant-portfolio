[project]
name = "podcast-ai-assistant"
version = "0.1.0"
description = "A grounded podcast assistant with timestamped citations."
requires-python = ">=3.11"
dependencies = [
    "faiss-cpu>=1.13,<2",
    "httpx>=0.27,<1",
    "numpy>=1.26,<3",
    "openai>=1,<3",
    "pydantic>=2,<3",
    "python-dotenv>=1,<2",
    "sqlalchemy>=2,<3",
    "sqlglot>=30.13,<31",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.141,<0.142",
    "uvicorn>=0.52,<0.53",
]
dev = ["pytest>=8,<10"]
experiment = ["langgraph>=1.2,<1.3"]
mcp = ["mcp>=2,<3"]
postgres = ["psycopg[binary]>=3,<4"]

[tool.setuptools.packages.find]
include = ["app*", "experiments*"]
exclude = ["data*", "tests*"]

[tool.setuptools.package-data]
"app.api" = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
